project:
  type: website
  # Quarto's default input list includes *.rmarkdown, which is also the
  # extension of the intermediate file its knitr engine writes next to a .qmd
  # while rendering. If a render is interrupted that intermediate survives, and
  # the next render picks it up as an extra input document -- which broke two
  # renders here, once by rendering the take-home report twice and once by
  # leaving the output-moving step with a file it could not find. Naming the
  # inputs explicitly keeps a stray intermediate from ever becoming one.
  # `_sections/` and `_include/` need no exclusion: Quarto already skips paths
  # whose name begins with an underscore.
  render:
    - "**/*.qmd"
    # Take-home Exercise 1 is written but not published yet, so it stays out of
    # the build: leaving it in put its text into `_site/search.json`, which is
    # the whole site's search index, and a partial render of it had already
    # overwritten that index with take-home entries alone. Its 145 chunks are
    # also the only part of the site that needs several GB to render. Remove
    # this line to publish it.
    - "!take-home-ex/"

