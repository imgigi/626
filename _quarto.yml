        text: About

format:
  html:
    theme: cosmo
    css: styles.css
    # The EN / 中文 switch is site chrome, so it is declared once here rather
    # than per document. Before this it was injected by the two take-home
    # documents' own YAML, which is why nine of the eleven pages had no switch
    # at all. Documents that set their own `include-in-header` override this,
    # so those must include the same files themselves.
    include-in-header: _include/lang-head.html
    include-after-body: _include/lang-toggle.html
    toc: true
    page-layout: full
    grid:
      body-width: 1400px
      sidebar-width: 220px
      margin-width: 300px
