          - text: "Exercise 2b · 2nd Order Spatial Point Patterns Analysis"
            href: hand-on-ex/hand-on-ex2/hand-on-ex2b.qmd
          - text: "---"
          - text: "Exercise 3 · Spatio-Temporal Point Patterns Analysis"
            href: hand-on-ex/hand-on-ex3/hand-on-ex3.qmd
          - text: "---"
          - text: "Exercise 4 · Spatial Weights and Applications"
            href: hand-on-ex/hand-on-ex4/hand-on-ex4.qmd
      - text: "In-class Exercise"
        menu:
          - text: "Exercise 1 · Analytical Maps and the Raster Data Model"
            href: in-class-ex/in-class-ex1/in-class-ex1.qmd
          - text: "---"
