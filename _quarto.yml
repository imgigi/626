        menu:
          # These point at the built .html, not at the .qmd. Quarto rewrites a
          # .qmd navbar href to .html only for documents it renders, and the
          # take-home pair is excluded from `project.render` above -- so a .qmd
          # href here was served to the browser as raw source.
          - text: "Exercise 1 · Technical Report"
            href: take-home-ex/take-home-ex1/take-home-ex1.html
          - text: "Exercise 1 · Executive Summary"
            href: take-home-ex/take-home-ex1/take-home-ex1-slides.html
